        <script>
            (function () {
                var STORAGE_KEY = "afo_theme";
                function getStored() {
                    try {
                        return localStorage.getItem(STORAGE_KEY);
                    } catch (_) {
                        return null;
                    }
                }
                function setStored(v) {
                    try {
                        localStorage.setItem(STORAGE_KEY, v);
                    } catch (_) {}
                }
                function apply(theme) {
                    document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
                    var input = document.getElementById("themeToggleInput");
                    if (input) input.checked = theme === "dark";
                }
                window.__setTheme = function (theme) {
                    setStored(theme);
                    apply(theme);
                };
                apply(getStored() || "light");
                document.addEventListener("DOMContentLoaded", function () {
                    apply(getStored() || "light");
                });
            })();
        </script>

        <style>
            :root {
                --primary-blue: #4a90e2;
                --light-blue: #e8f4f8;
                --lighter-blue: #f5fbfd;
                --dark-blue: #2c5f8d;
                --text-dark: #1a2332;
                --text-medium: #4a5568;
                --border-color: #d4e8f0;
                --white: #ffffff;
                --nav-height: 64px;
                --banner-height: 0px;
                --safe-top: env(safe-area-inset-top, 0px);
                --safe-bottom: env(safe-area-inset-bottom, 0px);
                --safe-left: env(safe-area-inset-left, 0px);
                --safe-right: env(safe-area-inset-right, 0px);
                --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
                --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            }

            :root[data-theme="dark"] {
                --primary-blue: #5ba3f5;
                --light-blue: #1e2a38;
                --lighter-blue: #141c26;
                --dark-blue: #7db8f8;
                --text-dark: #eef2f7;
                --text-medium: #b7c2cf;
                --border-color: #2c3b4a;
                --white: #1a232e;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }

            html,
            body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--white);
                font-family: "DM Sans", sans-serif;
                overscroll-behavior: none;
                transition: background-color 0.25s ease;
            }

            button {
                touch-action: manipulation;
                font-size: 16px;
            }

            nav {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: calc(var(--nav-height) + var(--safe-top));
                padding-top: var(--safe-top);
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(16px) saturate(180%);
                -webkit-backdrop-filter: blur(16px) saturate(180%);
                border-bottom: 1.5px solid var(--border-color);
                box-shadow: 0 2px 24px rgba(74, 144, 226, 0.08);
                display: flex;
                align-items: center;
                padding-left: max(1.25rem, var(--safe-left));
                padding-right: max(1.25rem, var(--safe-right));
                z-index: 100;
                transition:
                    background-color 0.25s ease,
                    border-color 0.25s ease;
            }
            :root[data-theme="dark"] nav {
                background: rgba(20, 28, 38, 0.92);
            }
            .nav-inner {
                width: 100%;
                max-width: 2400px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: var(--nav-height);
                min-width: 0;
                gap: 0.75rem;
            }
            .logo {
                font-family: "Spectral", serif;
                font-size: 1.6rem;
                font-weight: 700;
                color: var(--primary-blue);
                text-decoration: none;
                letter-spacing: -0.01em;
                white-space: nowrap;
                flex-shrink: 0;
                transition: color 0.2s var(--ease-standard);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
            }
            .logo img {
                height: 40px;
                max-width: 100%;
                display: block;
            }
            .logo:hover {
                color: var(--dark-blue);
            }

            .nav-links {
                display: flex;
                align-items: center;
                gap: 0.2rem;
                list-style: none;
                min-width: 0;
                flex-wrap: nowrap;
            }
            .nav-links button {
                color: var(--text-medium);
                background: none;
                border: none;
                font-family: "DM Sans", sans-serif;
                font-weight: 500;
                font-size: 0.97rem;
                padding: 0.45rem 0.9rem;
                border-radius: 8px;
                cursor: pointer;
                transition:
                    color 0.18s var(--ease-standard),
                    background 0.18s var(--ease-standard);
                white-space: nowrap;
                position: relative;
            }
            .nav-links button:hover {
                color: var(--primary-blue);
                background: var(--lighter-blue);
            }
            .nav-links button.active {
                color: var(--primary-blue);
                background: var(--light-blue);
                font-weight: 600;
            }
            .nav-links button::after {
                content: "";
                position: absolute;
                bottom: 4px;
                left: 50%;
                right: 50%;
                height: 2px;
                background: var(--primary-blue);
                border-radius: 2px;
                transition:
                    left 0.28s var(--ease-out),
                    right 0.28s var(--ease-out);
            }
            .nav-links button.active::after {
                left: 12px;
                right: 12px;
            }

            .theme-toggle-row {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                flex-shrink: 0;
            }
            .theme-toggle-switch {
                position: relative;
                width: 44px;
                height: 24px;
                flex-shrink: 0;
                display: inline-block;
            }
            .theme-toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .theme-toggle-slider {
                position: absolute;
                inset: 0;
                background: #cbd5e0;
                border-radius: 24px;
                cursor: pointer;
                transition: background 0.25s;
            }
            :root[data-theme="dark"] .theme-toggle-slider {
                background: #4a5568;
            }
            .theme-toggle-slider::before {
                content: "\2600";
                position: absolute;
                height: 18px;
                width: 18px;
                left: 3px;
                top: 3px;
                background: white;
                border-radius: 50%;
                transition: transform 0.25s;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
                line-height: 1;
            }
            .theme-toggle-switch input:checked + .theme-toggle-slider {
                background: var(--primary-blue);
            }
            .theme-toggle-switch input:checked + .theme-toggle-slider::before {
                transform: translateX(20px);
                content: "\1F319";
            }

            .hamburger {
                display: none;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 5px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0.6rem;
                border-radius: 8px;
                transition: background 0.18s var(--ease-standard);
                flex-shrink: 0;
                min-width: 44px;
                min-height: 44px;
            }
            .hamburger:hover {
                background: var(--lighter-blue);
            }
            .hamburger span {
                display: block;
                width: 22px;
                height: 2.5px;
                background: var(--text-medium);
                border-radius: 2px;
                transition: all 0.32s var(--ease-standard);
                transform-origin: center;
            }
            .hamburger.open span:nth-child(1) {
                transform: translateY(7.5px) rotate(45deg);
            }
            .hamburger.open span:nth-child(2) {
                opacity: 0;
                transform: scaleX(0);
            }
            .hamburger.open span:nth-child(3) {
                transform: translateY(-7.5px) rotate(-45deg);
            }

            #notifBanner {
                position: fixed;
                top: calc(var(--nav-height) + var(--safe-top));
                left: 0;
                right: 0;
                z-index: 98;
                overflow: hidden;
                max-height: 0;
                transition:
                    max-height 0.42s var(--ease-standard),
                    opacity 0.32s ease;
                opacity: 0;
                will-change: max-height, opacity;
            }
            #notifBanner.visible {
                max-height: 160px;
                opacity: 1;
            }
            .banner-inner {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.5rem 1rem;
                padding: 0.7rem 3rem;
                padding-left: max(3rem, calc(var(--safe-left) + 1rem));
                padding-right: max(3rem, calc(var(--safe-right) + 1rem));
                font-size: 0.95rem;
                font-weight: 500;
                min-height: 44px;
                position: relative;
            }
            .banner-text {
                flex: 1 1 auto;
                text-align: center;
                min-width: 120px;
                word-break: break-word;
            }
            .banner-btn {
                display: inline-block;
                padding: 0.35rem 1rem;
                border-radius: 20px;
                font-size: 0.85rem;
                font-weight: 700;
                cursor: pointer;
                border: none;
                font-family: "DM Sans", sans-serif;
                white-space: nowrap;
                flex-shrink: 0;
                transition:
                    opacity 0.2s var(--ease-standard),
                    transform 0.15s var(--ease-standard);
                text-decoration: none;
            }
            .banner-btn:hover {
                opacity: 0.85;
                transform: translateY(-1px);
            }
            .banner-close {
                position: absolute;
                right: max(0.5rem, var(--safe-right));
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                cursor: pointer;
                font-size: 1.1rem;
                opacity: 0.6;
                padding: 0.4rem;
                min-width: 32px;
                min-height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: opacity 0.2s var(--ease-standard);
            }
            .banner-close:hover {
                opacity: 1;
            }

            .drawer {
                position: fixed;
                top: calc(var(--nav-height) + var(--safe-top));
                left: 0;
                right: 0;
                background: rgba(255, 255, 255, 0.97);
                backdrop-filter: blur(20px);
                border-bottom: 1.5px solid var(--border-color);
                box-shadow: 0 8px 32px rgba(74, 144, 226, 0.12);
                z-index: 99;
                overflow: hidden;
                max-height: 0;
                transition:
                    max-height 0.36s var(--ease-standard),
                    opacity 0.26s ease;
                opacity: 0;
                will-change: max-height, opacity;
            }
            :root[data-theme="dark"] .drawer {
                background: rgba(20, 28, 38, 0.97);
            }
            .drawer.open {
                max-height: 460px;
                opacity: 1;
                overflow-y: auto;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            .drawer.open::-webkit-scrollbar {
                display: none;
            }
            .drawer-links {
                list-style: none;
                padding: 0.75rem max(1rem, var(--safe-left)) calc(1rem + var(--safe-bottom));
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
            }
            .drawer-links button {
                width: 100%;
                text-align: left;
                background: none;
                border: none;
                font-family: "DM Sans", sans-serif;
                font-weight: 500;
                font-size: 1.05rem;
                color: var(--text-medium);
                padding: 0.8rem 1rem;
                border-radius: 10px;
                cursor: pointer;
                min-height: 44px;
                transition:
                    color 0.18s var(--ease-standard),
                    background 0.18s var(--ease-standard);
            }
            .drawer-links button:hover,
            .drawer-links button:active {
                color: var(--primary-blue);
                background: var(--lighter-blue);
            }
            .drawer-links button.active {
                color: var(--primary-blue);
                background: var(--light-blue);
                font-weight: 600;
            }
            .drawer-theme-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.8rem 1rem;
                border-top: 1px solid var(--border-color);
                margin-top: 0.4rem;
            }
            .drawer-theme-row span {
                font-size: 0.95rem;
                color: var(--text-medium);
                font-weight: 500;
            }

            .content-shell {
                position: fixed;
                top: calc(var(--nav-height) + var(--safe-top) + var(--banner-height));
                left: 0;
                right: 0;
                bottom: 0;
                overflow: hidden;
                transition: top 0.42s var(--ease-standard);
            }

            .frame-slot {
                position: absolute;
                inset: 0;
                overflow: hidden;
                opacity: 0;
                transform: translateY(14px) scale(0.99);
                transition:
                    opacity 0.4s var(--ease-out),
                    transform 0.4s var(--ease-out);
                pointer-events: none;
                will-change: opacity, transform;
            }
            .frame-slot.visible {
                opacity: 1;
                transform: translateY(0) scale(1);
                pointer-events: auto;
                z-index: 2;
            }
            .frame-slot.exit {
                opacity: 0;
                transform: translateY(-8px) scale(1.005);
                pointer-events: none;
                z-index: 1;
                transition:
                    opacity 0.3s var(--ease-standard),
                    transform 0.3s var(--ease-standard);
            }
            .frame-slot iframe {
                width: calc(100% + 20px);
                height: 100%;
                border: none;
                display: block;
                background: var(--white);
            }

            .frame-loader {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: var(--lighter-blue);
                gap: 1rem;
                transition:
                    opacity 0.3s var(--ease-standard),
                    background-color 0.25s ease;
                padding: 1rem;
                text-align: center;
                z-index: 0;
            }
            .frame-loader.hidden {
                opacity: 0;
                pointer-events: none;
            }
            .loader-spinner {
                width: 36px;
                height: 36px;
                border: 3px solid var(--border-color);
                border-top-color: var(--primary-blue);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                flex-shrink: 0;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .loader-text {
                font-family: "DM Sans", sans-serif;
                color: var(--text-medium);
                font-size: 0.88rem;
                letter-spacing: 0.02em;
            }

            .ripple-overlay {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 200;
                overflow: hidden;
            }
            .ripple {
                position: absolute;
                border-radius: 50%;
                background: rgba(74, 144, 226, 0.12);
                transform: scale(0);
                animation: rippleOut 0.55s var(--ease-standard) forwards;
            }
            @keyframes rippleOut {
                to {
                    transform: scale(40);
                    opacity: 0;
                }
            }

            @media (max-width: 900px) {
                .nav-links button {
                    font-size: 0.9rem;
                    padding: 0.4rem 0.65rem;
                }
            }

            @media (max-width: 700px) {
                nav {
                    padding-left: max(1rem, var(--safe-left));
                    padding-right: max(1rem, var(--safe-right));
                }
                .nav-links {
                    display: none;
                }
                .hamburger {
                    display: flex;
                }
                .logo img {
                    height: 34px;
                }
                .banner-inner {
                    padding: 0.65rem 2.75rem;
                    padding-left: max(2.75rem, calc(var(--safe-left) + 0.75rem));
                    padding-right: max(2.75rem, calc(var(--safe-right) + 0.75rem));
                    font-size: 0.88rem;
                }
                .banner-btn {
                    font-size: 0.8rem;
                    padding: 0.3rem 0.85rem;
                }
                .nav-theme-toggle {
                    display: none;
                }
            }

            @media (max-width: 400px) {
                .logo img {
                    height: 28px;
                }
                nav {
                    padding-left: max(0.75rem, var(--safe-left));
                    padding-right: max(0.75rem, var(--safe-right));
                }
                .banner-text {
                    font-size: 0.82rem;
                }
            }

            @media (max-height: 420px) and (orientation: landscape) {
                :root {
                    --nav-height: 52px;
                }
                .logo img {
                    height: 30px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <nav>

                <a href="/" style="display: contents">
                    <span class="logo" onclick="navigate('/', event)">
                        <img src="https://allforonesmp.github.io/images/logo.png" alt="AllForOne SMP Logo" />
                    </span>
                </a>

                <ul class="nav-links" id="navLinks">

                    <li><button data-path="/rules" onclick="navigate('/rules', event)">Rules</button></li>
                    <li><button data-path="/make-skin" onclick="navigate('/make-skin', event)">Create A Skin</button></li>

                <button

        <div id="notifBanner">
            <div class="banner-inner" id="bannerInner">
                <span class="banner-text" id="bannerText">Backend server is offline, some features may not work right now.</span>
                <a class="banner-btn" id="bannerBtn" href="#" target="_blank" rel="noopener" style="display: none"></a>
                <button class="banner-close" id="bannerClose" onclick="dismissBanner()" aria-label="Dismiss">✕</button>
            </div>

        <div class="drawer" id="drawer">
            <ul class="drawer-links" id="drawerLinks">
                <li><button data-path="/" onclick="navigate('/', event); closeDrawer()">Home</button></li>
                <li><button data-path="/rules" onclick="navigate('/rules', event); closeDrawer()">Rules</button></li>
                <li>
                    <button data-path="/make-skin" onclick="navigate('/make-skin', event); closeDrawer()">
                        Create A Skin
                    </button>
                </li>
                <li>
                    <button data-path="/stats" onclick="navigate('/stats', event); closeDrawer()">Server Stats</button>
                </li>
                <li>
                    <button data-path="/admin" onclick="navigate('/admin', event); closeDrawer()">Admin Page</button>
                </li>
            </ul>
            <div class="drawer-theme-row">
                <span>Dark mode</span>
                <label class="theme-toggle-switch">
                    <input
                        type="checkbox"
                        id="themeToggleInputMobile"
                        onchange="window.__setTheme(this.checked ? 'dark' : 'light')" />
                    <span class="theme-toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="ripple-overlay" id="rippleOverlay"></div>
        <div class="content-shell" id="contentShell"></div>

        <script>
            (function () {
                try {
                    var depth = 0;
                    var win = window;
                    while (win !== win.parent) {
                        try {
                            if (win.parent.document && win.parent.document.getElementById("contentShell")) {
                                depth++;
                            }
                        } catch (_) {
                            break;
                        }
                        win = win.parent;
                        if (depth > 2) break;
                    }
                    if (depth >= 1) {
                        document.documentElement.innerHTML =
                            '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#4a5568;text-align:center;padding:2rem;">' +
                            "This page (" +
                            window.location.pathname +
                            ") contains the site navbar and was loaded inside another navbar frame. " +
                            "route pages should only contain their own content." +
                            "</div>";
                        throw new Error("AllForOne SMP: blocked recursive navbar nesting");
                    }
                } catch (e) {
                    if (e && e.message && e.message.indexOf("blocked recursive navbar nesting") !== -1) throw e;
                }
            })();
        </script>

        <script>
            (function () {
                "use strict";
                const STATS_API_BASE = "https://a1-backend.tail1b131d.ts.net";
                const BANNER_POLL_MS = 15 * 1000;

                async function pollBanner() {
                    try {
                        const res = await fetch(`${STATS_API_BASE}/api/banner`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        window._bannerConfig = data || null;
                        if (window.reportBackendStatus) window.reportBackendStatus(true);
                        if (window.applyBanner) window.applyBanner(window._currentPath);
                    } catch (err) {
                        console.error("[banner] poll failed:", err);
                        if (window.reportBackendStatus) window.reportBackendStatus(false);
                    }
                }

                pollBanner();
                setInterval(pollBanner, BANNER_POLL_MS);
            })();
        </script>
        <script>
            const BASE = "";
            const ROUTES = {
                "/": BASE + "main.html",
                "/rules": BASE + "rules/index.html",
                "/make-skin": BASE + "make-skin/index.html",
                "/stats": BASE + "stats/index.html",
                "/admin": BASE + "admin/index.html"
            };
            const PAGE_TITLES = {
                "/": "AllForOne SMP",
                "/rules": "Rules | AllForOne SMP",
                "/make-skin": "Create Skin | AllForOne SMP",
                "/stats": "Server Stats | AllForOne SMP",
                "/admin": "Admin | AllForOne SMP"
            };
            const REFRESH_INTERVAL = 2 * 60 * 1000;
            const EXIT_DURATION = 320;

            // Only the rules page auto-refreshes in place while it's active.
            const AUTO_REFRESH_PATHS = ["/rules"];

            const shell = document.getElementById("contentShell");
            const overlay = document.getElementById("rippleOverlay");
            const drawer = document.getElementById("drawer");
            const hamburger = document.getElementById("hamburgerBtn");
            const notifBanner = document.getElementById("notifBanner");
            const bannerInner = document.getElementById("bannerInner");

            let currentPath = null;
            let frames = {};
            let activeSlot = null;
            let refreshTimers = {};
            let exitTimeout = null;
            let bannerDismissed = false;
            let bannerResizeObserver = null;
            let backendOffline = false;

            window._currentPath = "/";
            window._bannerConfig = null;

            function sendThemeToFrame(path) {
                const frame = frames[path];
                if (!frame) return;
                const theme = document.documentElement.getAttribute("data-theme") || "light";
                try {
                    frame.iframe.contentWindow.postMessage({ type: "afo-theme", theme: theme }, "*");
                } catch (_) {}
            }
            function broadcastThemeToAllFrames() {
                Object.keys(frames).forEach(sendThemeToFrame);
            }
            (function () {
                const base = window.__setTheme;
                window.__setTheme = function (theme) {
                    base(theme);
                    const a = document.getElementById("themeToggleInput");
                    const b = document.getElementById("themeToggleInputMobile");
                    if (a) a.checked = theme === "dark";
                    if (b) b.checked = theme === "dark";
                    broadcastThemeToAllFrames();
                };
            })();
            document.addEventListener("DOMContentLoaded", () => {
                const isDark = document.documentElement.getAttribute("data-theme") === "dark";
                const a = document.getElementById("themeToggleInput");
                const b = document.getElementById("themeToggleInputMobile");
                if (a) a.checked = isDark;
                if (b) b.checked = isDark;
            });
            // Shown whenever the stats/banner backend can't be reached. Takes over the
            // existing banner slot and ignores the remote-configured banner while offline.
            function showOfflineBanner() {
                const bannerText = document.getElementById("bannerText");
                const bannerBtn = document.getElementById("bannerBtn");
                const bannerClose = document.getElementById("bannerClose");

                bannerInner.style.backgroundColor = "#d9534f";
                bannerInner.style.color = "#ffffff";
                bannerClose.style.color = "#ffffff";
                bannerText.textContent = "Backend server is offline, some features may not work right now.";
                bannerBtn.style.display = "none";

                notifBanner.classList.add("visible");
                requestAnimationFrame(() => {
                    updateBannerHeight(bannerInner.offsetHeight);
                });
                observeBannerSize();
            }

            // Called by the polling script whenever a request to the backend succeeds or fails.
            window.reportBackendStatus = function (isOnline) {
                if (isOnline) {
                    if (backendOffline) {
                        backendOffline = false;
                        applyBanner(window._currentPath);
                    }
                } else {
                    if (!backendOffline) {
                        backendOffline = true;
                    }
                    // Re-assert on every failed poll too, in case the user dismissed it
                    // or navigated since the last time it was shown.
                    showOfflineBanner();
                }
            };

            function applyBanner(path) {
                // Offline state always wins over the remote-configured banner.
                if (backendOffline) {
                    showOfflineBanner();
                    return;
                }

                const cfg = window._bannerConfig;
                const bannerText = document.getElementById("bannerText");
                const bannerBtn = document.getElementById("bannerBtn");
                const bannerClose = document.getElementById("bannerClose");

                const hide = () => {
                    notifBanner.classList.remove("visible");
                    updateBannerHeight(0);
                };

                if (!cfg || !cfg.enabled || bannerDismissed) {
                    hide();
                    return;
                }

                const pages = cfg.pages || [];
                if (pages.length > 0 && !pages.includes(path)) {
                    hide();
                    return;
                }

                bannerInner.style.backgroundColor = cfg.bgColor || "#4a90e2";
                bannerInner.style.color = cfg.textColor || "#ffffff";
                bannerClose.style.color = cfg.textColor || "#ffffff";
                bannerText.textContent = cfg.text || "";

                if (cfg.btnLabel && cfg.btnLink) {
                    bannerBtn.textContent = cfg.btnLabel;
                    bannerBtn.href = cfg.btnLink;
                    bannerBtn.style.backgroundColor = cfg.btnBgColor || "rgba(255,255,255,0.25)";
                    bannerBtn.style.color = cfg.btnTextColor || "#ffffff";
                    bannerBtn.style.display = "inline-block";
                } else {
                    bannerBtn.style.display = "none";
                }

                notifBanner.classList.add("visible");
                requestAnimationFrame(() => {
                    updateBannerHeight(bannerInner.offsetHeight);
                });
                observeBannerSize();
            }
            window.applyBanner = applyBanner;

            function observeBannerSize() {
                if (bannerResizeObserver || typeof ResizeObserver === "undefined") return;
                bannerResizeObserver = new ResizeObserver((entries) => {
                    if (!notifBanner.classList.contains("visible")) return;
                    for (const entry of entries) {
                        updateBannerHeight(entry.contentRect.height);
                    }
                });
                bannerResizeObserver.observe(bannerInner);
            }

            function updateBannerHeight(h) {
                document.documentElement.style.setProperty("--banner-height", h + "px");
            }

            window.dismissBanner = function () {
                // While the backend is offline, the alert re-asserts itself on the next
                // poll (see reportBackendStatus) rather than staying dismissed.
                bannerDismissed = true;
                notifBanner.classList.remove("visible");
                updateBannerHeight(0);
            };

            function updateTitle(path) {
                const frame = frames[path];
                let iframeTitle = null;
                try {
                    iframeTitle = frame?.iframe?.contentDocument?.title;
                } catch (_) {
                    iframeTitle = null;
                }
                document.title = iframeTitle && iframeTitle.trim() ? iframeTitle : PAGE_TITLES[path] || "AllForOne SMP";
            }

            function spawnRipple(e) {
                const r = document.createElement("div");
                r.className = "ripple";
                const size = 60;
                let x, y;
                if (e && typeof e.clientX === "number" && (e.clientX !== 0 || e.clientY !== 0)) {
                    x = e.clientX - size / 2;
                    y = e.clientY - size / 2;
                } else if (e && e.target && e.target.getBoundingClientRect) {
                    const rect = e.target.getBoundingClientRect();
                    x = rect.left + rect.width / 2 - size / 2;
                    y = rect.top + rect.height / 2 - size / 2;
                } else {
                    x = window.innerWidth / 2 - size / 2;
                    y = window.innerHeight / 2 - size / 2;
                }
                r.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;`;
                overlay.appendChild(r);
                r.addEventListener("animationend", () => r.remove(), { once: true });
            }

            function getOrCreateFrame(path) {
                if (frames[path]) return frames[path];

                const slot = document.createElement("div");
                slot.className = "frame-slot";

                const loader = document.createElement("div");
                loader.className = "frame-loader";
                loader.innerHTML = `<div class="loader-spinner"></div><p class="loader-text">Loading…</p>`;
                slot.appendChild(loader);

                const iframe = document.createElement("iframe");
                iframe.src = ROUTES[path];
                iframe.style.opacity = "0";
                iframe.style.transition = "opacity 0.35s var(--ease-standard)";
                iframe.setAttribute("loading", "eager");
                iframe.setAttribute("title", PAGE_TITLES[path] || "AllForOne SMP");

                iframe.addEventListener("load", () => {
                    iframe.style.opacity = "1";
                    loader.classList.add("hidden");
                    if (currentPath === path) updateTitle(path);
                    try {
                        iframe.contentWindow.postMessage({ type: "afo-pathname", pathname: path }, "*");
                    } catch (_) {}
                    sendThemeToFrame(path);
                });

                slot.appendChild(iframe);
                shell.appendChild(slot);

                frames[path] = { slot, iframe, loader };
                startRefreshTimer(path);
                return frames[path];
            }

            // Removes a page's iframe entirely once you've navigated away from it, so the
            // next visit to that path builds a brand-new iframe and refetches its content
            // instead of showing the stale cached one.
            function destroyFrame(path) {
                const frame = frames[path];
                if (!frame) return;
                if (refreshTimers[path]) {
                    clearInterval(refreshTimers[path]);
                    delete refreshTimers[path];
                }
                if (frame.slot && frame.slot.parentNode) {
                    frame.slot.parentNode.removeChild(frame.slot);
                }
                delete frames[path];
            }

            function startRefreshTimer(path) {
                if (refreshTimers[path]) clearInterval(refreshTimers[path]);
                if (!AUTO_REFRESH_PATHS.includes(path)) return;
                refreshTimers[path] = setInterval(() => {
                    if (document.hidden) return;
                    const frame = frames[path];
                    if (!frame) return;
                    if (path === currentPath) {
                        frame.iframe.style.opacity = "0";
                        frame.loader.classList.remove("hidden");
                    }
                    frame.iframe.src = ROUTES[path];
                }, REFRESH_INTERVAL);
            }

            function setActiveButtons(path) {
                document.querySelectorAll("[data-path]").forEach((btn) => {
                    btn.classList.toggle("active", btn.getAttribute("data-path") === path);
                });
            }

            window.navigate = function (path, e) {
                if (!ROUTES[path]) return;
                if (path === currentPath) {
                    closeDrawer();
                    return;
                }
                spawnRipple(e);
                bannerDismissed = false;

                if (exitTimeout) {
                    clearTimeout(exitTimeout);
                    exitTimeout = null;
                }

                const outgoing = activeSlot;
                const outgoingPath = currentPath;
                if (outgoing) {
                    outgoing.classList.remove("visible");
                    outgoing.classList.add("exit");
                    exitTimeout = setTimeout(() => {
                        outgoing.classList.remove("exit");
                        exitTimeout = null;
                        // Tear down the page we just left so it's rebuilt from scratch
                        // (and refetched) the next time it's visited.
                        destroyFrame(outgoingPath);
                    }, EXIT_DURATION);
                }

                const frame = getOrCreateFrame(path);
                void frame.slot.offsetWidth;
                requestAnimationFrame(() => {
                    frame.slot.classList.add("visible");
                });

                activeSlot = frame.slot;
                currentPath = path;
                window._currentPath = path;
                setActiveButtons(path);
                updateTitle(path);
                applyBanner(path);
            };

            window.toggleDrawer = function () {
                const open = drawer.classList.toggle("open");
                hamburger.classList.toggle("open", open);
                hamburger.setAttribute("aria-expanded", String(open));
            };
            window.closeDrawer = function () {
                if (!drawer.classList.contains("open")) return;
                drawer.classList.remove("open");
                hamburger.classList.remove("open");
                hamburger.setAttribute("aria-expanded", "false");
            };
            document.addEventListener("click", (e) => {
                if (!drawer.contains(e.target) && !hamburger.contains(e.target)) closeDrawer();
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closeDrawer();
            });

            let resizeRAF = null;
            window.addEventListener("resize", () => {
                if (!window._bannerConfig) return;
                if (resizeRAF) cancelAnimationFrame(resizeRAF);
                resizeRAF = requestAnimationFrame(() => {
                    applyBanner(window._currentPath);
                    resizeRAF = null;
                });
            });

            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && currentPath && frames[currentPath]) {
                    updateTitle(currentPath);
                }
            });

            navigate("/", null);
        </script>
    </body>
</html>
