<!doctype html>
<html lang="en" data-theme="archive">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#08090b" />
        <title>Story Plan — AllForOne SMP</title>
        <meta name="description" content="The living archive and story-planning system for the AllForOne SMP universe." />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" type="image/png" href="../images/logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="./assets/theme.css" />
        <link rel="stylesheet" href="./assets/views.css" />
        <script src="https://kaidaz18.duckdns.org/sdk/bread-client.js" defer></script>
    </head>
    <body>
        <div id="boot" class="boot">
            <div class="boot-mark">A<span>F</span>O</div>
            <div class="boot-title">STORY&nbsp;PLAN</div>
            <div class="boot-sub">Opening the archive…</div>
            <div class="boot-bar"><i></i></div>
        </div>

        <div id="auth-root" class="auth-root" hidden></div>

        <div id="app" class="app" hidden>
            <aside id="sidebar" class="sidebar"></aside>
            <div class="app-main">
                <header id="topbar" class="topbar"></header>
                <main id="view" class="view" tabindex="-1"></main>
            </div>
            <div id="overlay-root"></div>
        </div>

        <div id="toast-root" class="toast-root" aria-live="polite"></div>
        <noscript>
            <div class="noscript">Story Plan needs JavaScript enabled to open the archive.</div>
        </noscript>

        <script type="module" src="./app/main.js"></script>
    </body>
</html>
